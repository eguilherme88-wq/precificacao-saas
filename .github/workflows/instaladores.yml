name: Gerar instaladores (Windows e Linux)

on:
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    branches: [main, instaladores-app]
    tags: ['v*']
    paths: ['index.html', 'manifest.webmanifest', 'sw.js', 'icons/**', 'desktop/**', '.github/workflows/instaladores.yml']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    # Publica na página Releases ao enviar para main (ou tag v*). Na branch de teste só gera os artifacts.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: versao
        run: echo "tag=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: arquivos/*
          tag_name: ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Partner Precificação SaaS ${{ steps.versao.outputs.tag }}
          body: |
            **Windows:** baixe `Precificacao-SaaS-*-win-x64.exe` (instalador) ou `*-portable.exe` (sem instalar).
            **Linux:** `.deb` (Ubuntu/Debian/Mint) ou `.AppImage` (qualquer distribuição).
            **Celular e tablet:** abra o sistema no navegador e toque em "Instalar app" / "Adicionar à tela inicial".
